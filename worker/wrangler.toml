name = "ai-academy-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Public, NON-secret settings. Secrets are NOT written here (see README, step 5).
[vars]
# Your GitHub Pages ORIGIN: scheme + host only, NO path, no trailing slash.
ALLOWED_ORIGIN = "https://hfrdy60-max.github.io"
# Max AI requests per minute per visitor IP (per Worker instance).
RATE_LIMIT_PER_MINUTE = "30"
# Optional: choose OpenRouter models (look up exact ids at https://openrouter.ai/models).
# Different tasks can use different models; unset = MODEL_DEFAULT.
# MODEL_DEFAULT = "openai/gpt-4o-mini"
# MODEL_LESSON  = "..."
# MODEL_CHAT    = "..."
# MODEL_CHECK   = "..."
# MODEL_OUTLINE = "..."

# Account storage is intentionally not bound until a real D1 database is created.
# After running: npx wrangler d1 create ai-academy-db
# Copy the returned database_id below, then uncomment this block:
# [[d1_databases]]
# binding = "DB"
# database_name = "ai-academy-db"
# database_id = "REPLACE_WITH_REAL_DATABASE_ID"
# migrations_dir = "migrations"
